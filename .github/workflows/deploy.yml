# Ganti nama workflow agar lebih jelas
name: Deploy to Development VPS

# Trigger: Kapan workflow ini harus dijalankan
on:
  push:
    branches:
      - development

# Daftar pekerjaan (jobs) yang akan dilakukan
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            git checkout development

            git pull origin development # <-- UBAH INI

            echo "✅ Code updated from development branch"

            docker compose exec app composer install --no-dev --optimize-autoloader

            echo "✅ Composer dependencies installed"

            docker compose exec app php artisan migrate --force

            echo "✅ Database migrated"

            docker compose exec app php artisan config:cache
            docker compose exec app php artisan route:cache
            docker compose exec app php artisan view:cache

            echo "✅ Application cache cleared and rebuilt"
            echo "🚀 Deployment to development finished successfully!"
