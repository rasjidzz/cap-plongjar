name: Deploy Backend to Development VPS

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Navigasi ke direktori project utama di VPS
            cd ${{ secrets.PROJECT_PATH }}

            # Masuk ke direktori backend untuk update dari Git
            echo "▶️ Updating backend code from repository..."
            cd backend
            git config pull.rebase false
            git reset --hard origin/development
            git clean -df
            git pull origin development
            echo "✅ Backend code updated."

            # --- Bagian Kunci untuk Izin dan APP_KEY ---
            echo "▶️ Setting permissions for storage and .env..."
            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown $USER:www-data .env
            sudo chmod 664 .env
            echo "✅ Permissions set."

            # Kembali ke direktori project utama untuk docker compose commands
            cd ..

            # --- TAMBAHAN PENTING UNTUK MENGATASI CACHE DATABASE ---
            # Hentikan kontainer 'app' untuk memastikan pembersihan cache yang menyeluruh sebelum start
            echo "▶️ Stopping backend container for config refresh..."
            docker compose stop app || true # Stop tanpa error jika sudah berhenti
            echo "✅ Backend container stopped."

            # Bersihkan Laravel cache (di host, sebelum container start)
            # Ini akan menghapus file cache di bootstrap/cache/ yang mungkin rusak atau lama
            sudo rm -rf backend/bootstrap/cache/*
            echo "✅ Laravel cache files removed from host."

            # --- Generate APP_KEY (jika belum ada/kosong) ---
            # Kita perlu start app dulu untuk menjalankan artisan, tapi tanpa cache
            echo "▶️ Starting backend container briefly for APP_KEY check/generation..."
            docker compose up -d app # Pastikan kontainer 'app' berjalan untuk perintah Artisan
            echo "✅ Backend container started briefly."


            docker compose exec app php artisan key:generate
            echo "✅ APP_KEY generated."

            # Setelah APP_KEY dipastikan, BERSIHKAN CACHE LAGI untuk memastikan APP_KEY baru ter-cache
            echo "▶️ Clearing and rebuilding Laravel cache after APP_KEY check..."
            docker compose exec app php artisan config:clear
            docker compose exec app php artisan cache:clear
            docker compose exec app php artisan config:cache # Recache dengan APP_KEY yang benar
            docker compose exec app php artisan route:cache
            docker compose exec app php artisan view:cache
            echo "✅ Laravel cache rebuilt."
            # --- AKHIR TAMBAHAN PENTING ---

            # Bangun ulang image Docker untuk service 'app'
            echo "▶️ Rebuilding backend Docker image..."
            docker compose build app
            echo "✅ Docker image rebuilt."

            # Restart kontainer aplikasi
            echo "▶️ Restarting application container..."
            docker compose up -d app --force-recreate
            echo "✅ Application container restarted."

            # Jalankan perintah database migration
            echo "▶️ Running database migrations..."
            docker compose exec app php artisan migrate:fresh --seed --force # Tambahkan --force di sini
            echo "✅ Database migrations complete."

            echo "🚀 Deployment to development finished successfully!"
