# nginx/nginx.conf
server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Sesuaikan untuk akses lokal

    index index.php index.html index.htm;

    # Konfigurasi untuk aplikasi Laravel (backend)
    # Semua request ke /api akan diarahkan ke backend (php-fpm)
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass app:9000; # 'app' adalah nama service PHP-FPM di docker-compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # --- BAGIAN YANG HARUS DITAMBAHKAN/DILENGKAPI ---
    # Konfigurasi untuk request umum (termasuk Laravel frontend/public)
    location / {
        # Root direktori untuk file-file statis dan index.php Laravel
        # Ini penting agar Nginx bisa menemukan public/index.php
        root /var/www/html/public; # <--- PASTIKAN INI MENUNJUK KE FOLDER `public` LARAVEL ANDA

        # Untuk aplikasi Laravel SPA (Single Page Application) atau router Laravel
        # Ini akan mencoba mencari file ($uri), jika tidak ada mencoba folder ($uri/),
        # jika keduanya tidak ada, baru diarahkan ke index.php (untuk Laravel router)
        try_files $uri $uri/ /index.php?$query_string; # <--- PENTING UNTUK LARAVEL ROUTING

        # Jika ada PHP scripts lain yang ingin Anda layani langsung
        # (ini sebenarnya duplikasi dari location ~\.php$, tapi memastikan fallback)
        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    # --- AKHIR BAGIAN YANG HARUS DITAMBAHKAN/DILENGKAPI ---

    # Penanganan error untuk PHP files (jarang digunakan jika semua via /api)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to .env and other sensitive files
    location ~ /\.env {
        deny all;
    }
}
