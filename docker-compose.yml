version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: plongjarv1_backend_app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - ./storage:/var/www/html/storage
        networks:
            - app-network
        depends_on:
            - mysql_db
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql_db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-plongjarv1}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD:-your_local_db_password}
            APP_KEY: ${APP_KEY}
            APP_ENV: local
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: ${APP_URL:-http://localhost}

    mysql_db:
        image: mysql:8.0
        container_name: mysql_db
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-plongjarv1}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_local_db_password}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

    nginx_server:
        image: nginx:alpine
        container_name: nginx_server
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
            timeout: 10s
            retries: 3

volumes:
    mysql_data:

networks:
    app-network:
        driver: bridge